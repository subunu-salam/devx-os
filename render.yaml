services:
  - type: web
    name: devx-os
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: JWT_SECRET
        generateValue: true
      # DevX OS stores all data in Postgres (e.g. a free Neon database), so nothing
      # resets on redeploy — even on Render's free plan, no persistent disk required.
      # Set this in the Render dashboard (Environment tab) to your Neon connection string:
      #   postgresql://user:password@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
